name: Docker Build and Push

on:
  release:
    types: [published]
  # Manual run: builds a test tag only (never touches :latest, so Watchtower ignores it)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Test tag to push, e.g. test-ipinfo'
        required: true
        default: 'test'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - {uses: gacts/github-slug@v1, id: slug}

    - name: Decide tags
      id: tags
      run: |
        IMG="${{ secrets.DOCKERHUB_USERNAME }}/netcheck-api"
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "list=$IMG:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
        else
          echo "list=$IMG:latest" >> "$GITHUB_OUTPUT"
        fi

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.tags.outputs.list }}

    - name: Push README to Docker Hub
      if: github.event_name == 'release'
      uses: christian-korneck/update-container-description-action@v1
      env:
        DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
      with:
        destination_container_repo: ${{ secrets.DOCKERHUB_USERNAME }}/netcheck-api
        provider: dockerhub
        readme_file: 'README.md'
